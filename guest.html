<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0b10">
  <title>Aggiungi una canzone · Karaoke</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎤</text></svg>">
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/guest.js"></script>
</head>
<body class="guest-page">
  <div id="bg"></div>

  <header class="g-top">
    <div class="g-brand">🎤 Karaoke</div>
    <button id="gChangeName" class="g-name" type="button" hidden></button>
  </header>

  <div id="gBanner" class="g-banner" role="status" hidden></div>

  <!-- First visit: ask for a name once -->
  <section id="gWelcome" class="g-welcome" hidden>
    <div class="g-welcome-emoji">🎤</div>
    <h1>Come ti chiami?</h1>
    <p class="g-muted">Così sul maxischermo sanno chi chiamare a cantare.</p>
    <form id="gNameForm" class="g-name-form">
      <input id="gName" placeholder="Il tuo nome" autocomplete="nickname" maxlength="40" required enterkeyhint="done">
      <button class="primary big" type="submit">Continua</button>
    </form>
  </section>

  <main id="gMain" hidden>
    <!-- Tab: search -->
    <section id="tabSearch" class="g-tab">
      <div class="g-searchbar">
        <span aria-hidden="true">🔍</span>
        <input id="gSearch" type="search" placeholder="Cerca un titolo o un artista" autocomplete="off" spellcheck="false" enterkeyhint="search" aria-label="Cerca una canzone">
        <button id="gClear" type="button" aria-label="Cancella la ricerca" hidden>✕</button>
      </div>
      <p id="gStatus" class="g-status" hidden></p>
      <ul id="gResults" class="g-list"></ul>
      <div id="gSearchEmpty" class="g-empty">
        <div class="g-empty-emoji">🎶</div>
        <p>Cerca la canzone che vuoi cantare,<br>poi tocca <b>+</b> per metterla in coda.</p>
      </div>
    </section>

    <!-- Tab: queue -->
    <section id="tabQueue" class="g-tab" hidden>
      <div id="gMineBox" hidden>
        <h2 class="g-h2">Le tue canzoni</h2>
        <div id="gMine" class="g-mine-list"></div>
      </div>

      <div id="gNow" class="g-now" hidden>
        <div class="g-label">Ora canta</div>
        <div id="gNowSinger" class="g-now-singer"></div>
        <div id="gNowSong" class="g-muted"></div>
      </div>

      <h2 class="g-h2">In coda</h2>
      <ol id="gQueue" class="g-list"></ol>
      <div id="gQueueEmpty" class="g-empty">
        <div class="g-empty-emoji">🙋</div>
        <p>Ancora nessuno in coda.<br>Inizia tu!</p>
      </div>
    </section>
  </main>

  <nav id="gTabs" class="g-tabs" hidden>
    <button type="button" data-tab="search" class="active"><span aria-hidden="true">🔍</span>Cerca</button>
    <button type="button" data-tab="queue"><span aria-hidden="true">🎶</span>Coda<b id="gQueueBadge" class="g-tab-badge" hidden></b></button>
  </nav>

  <!-- Add a song: bottom sheet -->
  <dialog id="gSheet" class="g-sheet">
    <form id="gSheetForm">
      <div class="g-sheet-grip" aria-hidden="true"></div>
      <div class="g-sheet-song">
        <img id="gsCover" alt="">
        <div>
          <div id="gsTitle" class="g-sheet-title"></div>
          <div id="gsArtist" class="g-muted"></div>
        </div>
      </div>
      <label for="gsMessage" class="g-label">Messaggio o dedica <span class="g-muted">(facoltativo)</span></label>
      <textarea id="gsMessage" rows="2" maxlength="160" placeholder="Viene mostrato e letto ad alta voce prima della tua canzone"></textarea>
      <button id="gsAdd" type="submit" class="primary big">Aggiungi alla coda</button>
      <button id="gsCancel" type="button" class="ghost">Annulla</button>
    </form>
  </dialog>

  <div id="toast" class="g-toast" role="status" hidden></div>
</body>
</html>
